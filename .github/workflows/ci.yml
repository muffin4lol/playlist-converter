name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: playlist
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: playlist_converter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U playlist -d playlist_converter_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://playlist:test-only-password@localhost:5432/playlist_converter_test
      APP_URL: http://127.0.0.1:3000
      SMTP_URL: smtp://127.0.0.1:11025
      TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Real account and authorization smoke test
        run: |
          npm run dev > /tmp/playlist-dev.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000 > /dev/null; then break; fi
            sleep 1
          done
          npm run smoke
